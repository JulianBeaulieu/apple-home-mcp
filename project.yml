name: AppleHomeMCP
options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  MCPKit:
    path: Packages/MCPKit
targets:
  AppleHomeMCP:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Info.plist", "AppleHomeMCP.entitlements"]
      - path: Shared
    dependencies:
      - package: MCPKit
        product: MCPKit
      - sdk: HomeKit.framework
      - sdk: Matter.framework
      - target: MenuBar
        platformFilter: maccatalyst
        embed: true
        copy:
          destination: plugins
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: Apple Home MCP
        PRODUCT_MODULE_NAME: AppleHomeMCP
        EXECUTABLE_NAME: AppleHomeMCP
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/AppleHomeMCP.entitlements
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        TARGETED_DEVICE_FAMILY: "2,6"
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  MenuBar:
    type: bundle
    platform: macOS
    sources:
      - path: MenuBar
        excludes: ["Info.plist"]
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).menubar
        PRODUCT_NAME: MenuBar
        INFOPLIST_FILE: MenuBar/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
